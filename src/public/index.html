    <script type="text/javascript">
        //import SoundEnum from './cloudbot.js';

        let _streamSession = new StreamSession();
        _streamSession.Id = Math.floor((Math.random() * 100));

        // Ceebee Auto-Participation state
        let ceebeeSettings = { auto_participate: 0, min_messages: 10, max_messages: 15 };
        let ceebeeChatCounter = 0;
        let ceebeeTargetLimit = 12;
        let ceebeeAccumulatedMessages = [];

        function fetchCeebeeSettings() {
            fetch('/api/ceebee/settings')
                .then(res => res.json())
                .then(data => {
                    ceebeeSettings = data;
                    // Only update target limit if it hasn't been set yet or the range changed
                    const min = ceebeeSettings.min_messages ?? 10;
                    const max = ceebeeSettings.max_messages ?? 15;
                    if (ceebeeTargetLimit < min || ceebeeTargetLimit > max) {
                        updateCeebeeTargetLimit();
                    }
                })
                .catch(err => console.error('Error fetching Ceebee settings:', err));
        }

        function updateCeebeeTargetLimit() {
            const min = ceebeeSettings.min_messages ?? 10;
            const max = ceebeeSettings.max_messages ?? 15;
            ceebeeTargetLimit = Math.floor(Math.random() * (max - min + 1)) + min;
            console.log(`Ceebee auto-participation target set to ${ceebeeTargetLimit} messages.`);
        }

        function shouldCountMessage(user, message, flags) {
            const lowerUser = user.toLowerCase();
            if (lowerUser === 'ceebee_bot' || lowerUser === 'ceebee') return false;
            if (lowerUser === 'streamlabs' || lowerUser === 'nightbot' || lowerUser === 'streamelements') return false;
            
            const trimmed = message.trim();
            if (!trimmed) return false;
            if (trimmed.startsWith('!')) return false;
            if (trimmed.startsWith('[')) {
                const bracketCommand = extractBracketCommand(trimmed);
                if (bracketCommand) return false;
            }
            if (trimmed.toLowerCase().includes('ceebee')) return false;
            
            return true;
        }

        function extractBracketCommand(message) {
            if (!message) {
                return null;
            }
            const trimmed = message.trim();
            if (!trimmed.startsWith('[')) {
                return null;
            }
            const closingIndex = trimmed.indexOf(']');
            if (closingIndex === -1) {
                return null;
            }
            const bracketContent = trimmed.slice(1, closingIndex);
            const colonIndex = bracketContent.indexOf(':');
            const atIndex = bracketContent.indexOf('@');
            const bracketChannel = colonIndex === -1 ? null : bracketContent.slice(0, colonIndex).trim();
            const bracketUser = (atIndex === -1 || atIndex + 1 >= bracketContent.length)
                ? null
                : bracketContent.slice(atIndex + 1).trim().toLowerCase();
            const afterBracket = trimmed.slice(closingIndex + 1).trimStart();
            if (!afterBracket.startsWith('!')) {
                return null;
            }
            const payload = afterBracket.slice(1);
            if (!payload) {
                return null;
            }
            const firstSpaceIndex = payload.indexOf(' ');
            const rawCommand = firstSpaceIndex === -1 ? payload : payload.slice(0, firstSpaceIndex);
            const command = rawCommand.toLowerCase();
            const args = firstSpaceIndex === -1 ? '' : payload.slice(firstSpaceIndex + 1).trim();
            return { command, message: args, user: bracketUser, channel: bracketChannel };
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function markdownToHtml(markdownText) {
            if (!markdownText) {
                return '';
            }

            let html = escapeHtml(markdownText);

            html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
            html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
            html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/_(.+?)_/g, '<em>$1</em>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

            html = html.replace(/^(\s*[-*+]\s+.+(?:\n\s*[-*+]\s+.+)*)/gm, function (match) {
                const items = match
                    .trim()
                    .split(/\n/)
                    .map(line => line.replace(/^\s*[-*+]\s+/, ''))
                    .map(item => `<li>${item}</li>`)
                    .join('');
                return `<ul>${items}</ul>`;
            });

            html = html.replace(/\n/g, '<br>');
            return html;
        }

        //Add Default Reminders
        //_streamSession.Reminders.push(new Reminder("project", "Did you assign a project yet?"));

        function handleUserChatEvent(user) {
            const lowerUser = user.toLowerCase();
            const bots = ['ceebee_bot', 'ceebee', 'streamlabs', 'nightbot', 'streamelements'];
            if (bots.includes(lowerUser)) return;

            fetch('/api/chat-event', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: lowerUser })
            })
            .then(res => res.json())
            .then(data => {
                if (data.shouldGreet && data.greetingMessage) {
                    CeebeeSay(data.greetingMessage);
                }
                if (data.shouldShoutout && data.shoutoutMessage) {
                    CeebeeSay(data.shoutoutMessage);
                }
            })
            .catch(err => console.error('Error reporting chat event:', err));
        }

        ComfyJS.onCommand = async (user, command, message, flags, extra) => {

            user = user.toLowerCase();
            handleUserChatEvent(user);

            //== RPG commands ==
            if (command === "search" || command === "loot") {
                console.log("!search was typed in chat");
                fetch('/api/loot/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.disabled) {
                        ChatBotSay(`@${user}, ${data.message}`);
                    } else if (data.onCooldown) {
                        ChatBotSay(`@${user}, you are on cooldown. Please wait ${data.remainingMinutes} more minute(s) before searching again.`);
                    } else if (data.success) {
                        const emojiMap = { potion: '🧪 Potion', shield: '🛡️ Shield', 'rain-stone': '🌧️ Rain Stone', 'sun-stone': '☀️ Sun Stone', bomb: '💣 Bomb' };
                        const itemStr = emojiMap[data.item] || data.item;
                        ChatBotSay(`@${user} searched the cloud forest and found a ${itemStr}!`);
                    }
                })
                .catch(err => console.error('Error in !search:', err));
            }
            else if (command === "rpg" || command === "rpg-help" || command === "loot-help") {
                console.log("!rpg-help was typed in chat");
                ChatBotSay(`RPG Loot Game: Land a drop (25% chance) or type !search (10m cooldown) to find items. Type !bag to view your items, and !use [item] to trigger overlay animations!`);
            }
            else if (command === "bag" || command === "inventory") {
                console.log("!bag was typed in chat");
                fetch(`/api/loot/bag?username=${user}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        if (data.inventory.length === 0) {
                            ChatBotSay(`@${user}'s bag is completely empty! Land drops or use !search to find RPG items.`);
                        } else {
                            const emojiMap = { potion: '🧪 Potion', shield: '🛡️ Shield', umbrella: '☔ Umbrella', 'rain-stone': '🌧️ Rain Stone', 'sun-stone': '☀️ Sun Stone', bomb: '💣 Bomb' };
                            const itemsList = data.inventory.map(item => emojiMap[item] || item).join(', ');
                            ChatBotSay(`@${user}'s bag (${data.inventory.length}/5 items): ${itemsList}`);
                        }
                    }
                })
                .catch(err => console.error('Error in !bag:', err));
            }
            else if (command === "use") {
                console.log("!use was typed in chat with arg:", message);
                if (!message) {
                    ChatBotSay(`@${user}, please specify which item you want to use. Example: !use potion`);
                    return;
                }
                const requestedItem = message.toLowerCase().trim().replace(/[^a-z0-9-]/g, '');
                const validItems = ['potion', 'shield', 'umbrella', 'rain-stone', 'sun-stone', 'bomb'];
                const itemMap = {
                    'potion': 'potion', 'potion🧪': 'potion', '🧪': 'potion',
                    'shield': 'shield', 'shield🛡️': 'shield', '🛡️': 'shield',
                    'umbrella': 'umbrella', 'umbrella☔': 'umbrella', '☔': 'umbrella',
                    'rain-stone': 'rain-stone', 'rainstone': 'rain-stone', '🌧️': 'rain-stone',
                    'sun-stone': 'sun-stone', 'sunstone': 'sun-stone', '☀️': 'sun-stone',
                    'bomb': 'bomb', 'bomb💣': 'bomb', '💣': 'bomb'
                };
                const matchedItem = itemMap[requestedItem] || (validItems.includes(requestedItem) ? requestedItem : null);
                if (!matchedItem) {
                    ChatBotSay(`@${user}, that is not a valid item. Choose from: potion, shield, umbrella, rain-stone, sun-stone, bomb.`);
                    return;
                }

                fetch('/api/loot/use', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, item: matchedItem })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.disabled) {
                        ChatBotSay(`@${user}, RPG items are currently disabled.`);
                    } else if (data.noItem) {
                        ChatBotSay(`@${user}, you do not have that item in your bag.`);
                    } else if (data.success) {
                        const emojiMap = { potion: '🧪 Potion', shield: '🛡️ Shield', umbrella: '☔ Umbrella', 'rain-stone': '🌧️ Rain Stone', 'sun-stone': '☀️ Sun Stone', bomb: '💣 Bomb' };
                        const itemStr = emojiMap[matchedItem];
                        ChatBotSay(`@${user} used their ${itemStr}!`);
                    }
                })
                .catch(err => console.error('Error in !use:', err));
            }

            //== PUBLIC Commands Section =====================================
            //== 

            //-- fun ---------
            else if (command === "shout") {
                ChatBotShout(message);
            }

            else if (flags.broadcaster && command === "ok-bye") {
                ComfyJS.Disconnect();
            }
            else if (flags.broadcaster && command === "talk") {
                ChatBotSay(message);
            }
            else if (flags.broadcaster && command === "cloud") {
                cloud("Thumbs-up");
            }
            else if (flags.broadcaster && command === "clean") {
                console.log("!clean was typed in chat");
                clean();
            }
            else if (flags.broadcaster && command === "todo-add") {
                console.log("!addTodo was typed in chat");
                addTodo(message);
            }
            else if (flags.broadcaster && command === "todo-start") {
                console.log("!todo-start was typed in chat");
                SetTodoStatus(message, TodoStatusEnum.inProgress);
            }
            else if (flags.broadcaster && command === "todo-done") {
                console.log("!todo-done was typed in chat");
                SetTodoStatus(message, TodoStatusEnum.done);
            }
            else if (flags.broadcaster && command === "todo-cancel") {
                console.log("!todo-cancel was typed in chat");
                SetTodoStatus(message, TodoStatusEnum.cancel);
            }
            else if (command === "todo-show") {
                console.log("!todo-show was typed in chat");
                ShowTodoArea();
            }
            else if (command === "todo-hide") {
                console.log("!todo-hide was typed in chat");
                HideTodoArea();
            }
            else if (command === "scores") {
                scores();
            }
            else if (command === "stats") {
                console.log("!stats was typed in chat");
                StatsFor(user);
            }
            else if (command === "drop") {
                console.log("!drop was typed in chat");
                IncrementDropCounter(user);
            }

            //-- Clouds ---------
            else if (command === "rain") {
                console.log("!rain was typed in chat");
                document.getElementById("sky").className = "darkcloud";

                setTimeout(() => {
                    makeItRain();
                    playSound("rain", SoundEnum.rain, true);
                }, 5000);

            }
            else if (command === "sun") {
                console.log("!sun was typed in chat");
                cleanWeatherOverride();
            }

            //-- tools ---------
            else if (command === "ceebee" && user !== "ceebee" && user !== "ceebee_bot") {
                console.log("!ceebee was typed in chat");
                fetch('/api/ceebee/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, user: user })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.response) {
                            CeebeeSay(data.response);
                        }
                    })
                    .catch(err => {
                        console.error('Error calling Ceebee API:', err);
                    });
            }
            else if (command === "time") {
                console.log("!time was typed in chat");
                CreateTimeLog(message, user);
            }
            else if (command === "note" || command === "notes") {
                console.log("!note was typed in chat");
                SavingNote(message);
            }
            else if (command === "attention") {
                console.log("!attention was typed in chat");
                Attention(user, message);
            }
            else if (command === "referral" || command === "referrals" || command === "referal" || command === "referals") {
                console.log("!referral was typed in chat");
                ChatBotSay(`Interested about GitKraken? Check-out: http://c5m.ca/gitkraken it's free!`);
            }
            else if (command === "livecoders" || command === "livecoder") {
                console.log("!livecoder was typed in chat");
                ChatBotSay(`Frank is part of the Live Coders. It's a Twitch teams that support Coders/Developers/Technologists who are also Content Creators. Learn more about then here: https://livecoders.dev`);
            }
            else if (command === "cmd" || command === "commands" || command === "command") {
                console.log("!cmd was typed in chat");
                ChatBotSay(`If Frank did is job correctly you will find a list of all the command here: https://github.com/FBoucher/CloudBot#currently-available-commands`);
            }
            else if (flags.broadcaster && command === "so") {
                console.log("!so was typed in chat");
                if ((message !== undefined) && (message !== null) && (message !== "")) {
                    ChatBotSay(`==> Check-out the channel of twitch.tv/${message} `);
                }
            }

            //-- Reminders ---------
            else if (flags.broadcaster && command === "reminder-add") {
                console.log("!reminder-add was typed in chat");
                if (message.includes("|")) {
                    var reminderDetail = message.split("|");
                    addReminder(reminderDetail[0], reminderDetail[1]);
                }
                else {
                    ChatBotSay(`Hey ${user}, please use "|" to separate the name and the description of the Reminder.`);
                }

            }
            else if (flags.broadcaster && command === "reminder-stop") {
                console.log("!reminder-stop was typed in chat");
                SetReminderStatus(message, ReminderStatusEnum.done);
            }
            else if (flags.broadcaster && command === "reminder-pause") {
                console.log("!reminder-pause was typed in chat");
                SetReminderStatus(message, ReminderStatusEnum.inactive);
            }


            else if (flags.broadcaster && command === "hello") {
                console.log("-->streamSession: ", _streamSession);
                hello(user);
            }
            else if (flags.broadcaster && command === "save") {
                console.log("!save was typed in chat");
                SaveToFile();
            }
            else if (flags.broadcaster && command === "load") {
                console.log("!load was typed in chat");
                LoadFromFile(null, true, null);
            }
            else if (flags.broadcaster && command === "start") {
                console.log("!start was typed in chat");
                StreamNoteStart(message);
            }
            else if (flags.broadcaster && command === "stop") {
                console.log("!stop was typed in chat");
                StreamNoteStop();
                // Show StreamNotes panel
                let streamNotes = Generate_streamSession();
                const content = document.getElementById("streamNotesContent");
                //convert to HTML format
                content.innerHTML = markdownToHtml(streamNotes);
                document.getElementById("streamNotesPanel").style.display = "block";
                // Start scrolling animation
                startStreamNotesScroll();
            }
            else if (flags.broadcaster && command === "hide") {
                // Hide StreamNotes panel
                document.getElementById("streamNotesPanel").style.display = "none";
            }

            //=====================================================


            //== SOUNDS Section =====================================
            //== 
            else if (command === "yeah") {
                console.log("!yeah was typed in chat");
                playSound("yeah", SoundEnum.yeah);
            }
            else if (command === "bad") {
                console.log("!bad was typed in chat");
                playSound("badFeeling", SoundEnum.badFeeling);
            }
            else if (command === "bonjour") {
                console.log("!bonjour was typed in chat");
                let i = Math.floor(Math.random() * 3);
                console.log("i = ", i);
                switch (i) {
                    case 0:
                        playSound("bonjour", SoundEnum.bonjourHi);
                        break;
                    case 1:
                        playSound("sirbonjour", SoundEnum.sirbonjour);
                        break;
                    case 2:
                        playSound("sirbonjourhowareyou", SoundEnum.sirbonjourhowareyou);
                        break;
                }
            }
            else if (command === "knock") {
                console.log("!knock was typed in chat");
                playSound("doorknock", SoundEnum.doorknock);
            }
            else if (command === "previously") {
                console.log("!previously was typed in chat");
                playSound("previously", SoundEnum.previously);
            }


            //=====================================================
        }

        ComfyJS.onChat = (user, message, flags, self, extra) => {
            user = user.toLowerCase();
            handleUserChatEvent(user);
            trackMessageVelocity(message);

            const bracketCommand = extractBracketCommand(message);
            if (bracketCommand) {
                ComfyJS.onCommand(bracketCommand.user, bracketCommand.command, bracketCommand.message, flags, self, extra);
            }

            // Check if Ceebee is mentioned in normal chat
            if (message.toLowerCase().includes("ceebee") && user.toLowerCase() !== "ceebee" && user.toLowerCase() !== "ceebee_bot") {
                console.log("@ceebee was mentioned in chat");
                // Remove the mention from the message to save tokens and keep it clean
                const cleanMessage = message.replace(/ceebee/gi, '').trim();

                fetch('/api/ceebee/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: cleanMessage, user: user })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.response) {
                            CeebeeSay(data.response);
                        }
                    })
                    .catch(err => console.error('Error calling Ceebee API:', err));
            }

            // Process message for Ceebee auto-participation
            if (ceebeeSettings.auto_participate) {
                if (shouldCountMessage(user, message, flags)) {
                    ceebeeAccumulatedMessages.push(`${user}: ${message}`);
                    ceebeeChatCounter++;
                    console.log(`[Ceebee Auto] Message counted from ${user}: "${message}". Count: ${ceebeeChatCounter}/${ceebeeTargetLimit}`);
                    
                    if (ceebeeChatCounter >= ceebeeTargetLimit) {
                        const transcript = ceebeeAccumulatedMessages.join('\n');
                        console.log(`[Ceebee Auto] Threshold reached (${ceebeeTargetLimit}). Triggering participation API call...`);
                        
                        // Reset immediately to avoid duplicate triggers
                        ceebeeChatCounter = 0;
                        ceebeeAccumulatedMessages = [];
                        updateCeebeeTargetLimit();
                        
                        fetch('/api/ceebee/participate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ transcript })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.response) {
                                console.log('[Ceebee Auto] Received AI response:', data.response);
                                CeebeeSay(data.response);
                            } else {
                                console.warn('[Ceebee Auto] Received empty response from API.');
                            }
                        })
                        .catch(err => console.error('[Ceebee Auto] Error triggering auto-participation:', err));
                    }
                } else {
                    console.log(`[Ceebee Auto] Message from ${user} ignored by filter: "${message}"`);
                }
            }

            const trustedSenders = ['streamlabs', 'ceebee_bot', 'ceebee', 'streamelements', 'nightbot'];
            if (flags.broadcaster || trustedSenders.includes(user)) {
                console.log(`...parsing message from trusted source: ${user}`);
                ParseMessage(message);
            }
        }

        //== Events Section =====================================
        //== 
        ComfyJS.onRaid = (user, viewers, extra) => {
            LogRaid(user, viewers);
            if (ceebeeSettings.dynamic_weather_enabled) {
                triggerThunderstorm();
            }
        }

        ComfyJS.onSub = (user, message, subTierInfo, extra) => {
            console.log("...onSub");
            LogSub(user, message, subTierInfo, 1, 0);
            if (ceebeeSettings.dynamic_weather_enabled) {
                triggerRainbowSunshine();
            }
        }

        ComfyJS.onResub = (user, message, streamMonths, cumulativeMonths, subTierInfo, extra) => {
            console.log("...onResub");
            LogSub(user, message, subTierInfo, streamMonths, cumulativeMonths);
            if (ceebeeSettings.dynamic_weather_enabled) {
                triggerRainbowSunshine();
            }
        }

        ComfyJS.onHosted = (user, viewers, autohost, extra) => {
            LogHost(user, viewers, autohost, extra);
        }

        ComfyJS.onCheer = (user, message, bits, flags, extra) => {
            LogCheer(user, message, bits, flags, extra);
            if (ceebeeSettings.dynamic_weather_enabled && bits >= 100) {
                triggerRainbowSunshine();
            }
        }

        //=====================================================
        // Recuring tasks

        (function AutoSave() {
            console.log(`ChatBot #${_streamSession.Id} as save his data`);
            SaveToFile(false);
            setTimeout(AutoSave, 600000);
        })();

        (function TimeToCheckReminders() {
            console.log(`ChatBot #${_streamSession.Id} check his reminders`);
            CheckReminders();
            setTimeout(TimeToCheckReminders, 300000);
        })();

        //
        // Define a const authToken in secret.js (for fboucheros)
        // Define a const botAuthToken in secret.js (for ceebee_bot)
        // Generate them at: https://twitchtokengenerator.com/ (Use "Bot Chat Token")
        //

        // Connect the main ComfyJS client as fboucheros
        ComfyJS.Init("fboucheros", authToken);

        // Connect a secondary raw tmi.js client as ceebee_bot to send AI responses
        const ceebeeClient = new tmi.Client({
            connection: {
                reconnect: true,
                secure: true
            },
            identity: {
                username: "ceebee_bot",
                password: typeof botAuthToken !== 'undefined' ? botAuthToken : ""
            },
            channels: ["#fboucheros"]
        });

        // Only connect if the bot token is defined (so it doesn't break if missing)
        if (typeof botAuthToken !== 'undefined' && botAuthToken !== "") {
            ceebeeClient.connect().catch(console.error);
        }

        // Dedicated function to make the bot speak
        function CeebeeSay(msg) {
            console.log("CeebeeSay called with msg:", msg);
            if (ceebeeClient.readyState() === "OPEN") {
                ceebeeClient.say("#fboucheros", msg).catch(console.error);
            } else {
                console.warn("ceebee_bot is not connected. Falling back to fboucheros.");
                ComfyJS.Say(msg);
            }
        }
        for (var i = 0; i < 25; i++)
            CreateCloud();

        // Load Ceebee settings and poll every 15 seconds
        fetchCeebeeSettings();
        setInterval(fetchCeebeeSettings, 15000);

        // Add event listener for hide button
        document.addEventListener("DOMContentLoaded", function () {
            const hideBtn = document.getElementById("hideStreamNotesBtn");
            if (hideBtn) {
                hideBtn.onclick = function () {
                    document.getElementById("streamNotesPanel").style.display = "none";
                };
            }

            const panel = document.getElementById("streamNotesPanel");
            panel.addEventListener("transitionend", function () {
                if (panel.style.display === "none") {
                    const content = document.getElementById("streamNotesContent");
                    content.style.transition = 'none';
                    content.style.transform = 'translateY(100%)';
                }
            });
        });

        function startStreamNotesScroll() {
            const panel = document.getElementById('streamNotesPanel');
            const content = document.getElementById('streamNotesContent');
            if (!panel || !content) return;

            // Reset scroll position
            content.style.transition = 'none';
            content.style.transform = 'translateY(0)';

            // Calculate scroll distance and duration
            requestAnimationFrame(() => {
                const panelHeight = panel.clientHeight;
                const contentHeight = content.scrollHeight;
                const distance = panelHeight + contentHeight;
                const speed = 40; // pixels per second (adjust for slower/faster)
                const duration = distance / speed;

                content.style.transition = `transform ${duration}s linear`;
                content.style.transform = `translateY(-${contentHeight}px)`;

                // When animation ends, restart
                content.addEventListener('transitionend', function handler() {
                    content.removeEventListener('transitionend', handler);
                    startStreamNotesScroll();
                });
            }); // Allow DOM to update
        }

        // ===== Dynamic Weather & RPG Loot Game Logic =====
        let chatTimestamps = [];
        let weatherOverrideActive = false;
        let weatherOverrideTimeout = null;
        let originalSkyClass = 'lightcloud';

        function isCommandMessage(message) {
            if (!message) return false;
            const trimmed = message.trim();
            if (trimmed.startsWith('!')) return true;
            if (trimmed.startsWith('[')) {
                const closingIndex = trimmed.indexOf(']');
                if (closingIndex !== -1) {
                    const afterBracket = trimmed.slice(closingIndex + 1).trimStart();
                    if (afterBracket.startsWith('!')) {
                        return true;
                    }
                }
            }
            return false;
        }

        function trackMessageVelocity(message) {
            if (message && isCommandMessage(message)) {
                return;
            }
            const now = Date.now();
            chatTimestamps.push(now);
            chatTimestamps = chatTimestamps.filter(ts => now - ts < 60000);
            
            const mpm = chatTimestamps.length;
            console.log(`[Weather] Chat MPM: ${mpm}`);

            if (ceebeeSettings.dynamic_weather_enabled && !weatherOverrideActive) {
                applyDynamicWeather(mpm);
            }
        }

        setInterval(() => {
            if (chatTimestamps.length > 0) {
                const now = Date.now();
                chatTimestamps = chatTimestamps.filter(ts => now - ts < 60000);
                if (ceebeeSettings.dynamic_weather_enabled && !weatherOverrideActive) {
                    applyDynamicWeather(chatTimestamps.length);
                }
            }
        }, 10000);

        function setCloudSpeedMultiplier(factor) {
            document.querySelectorAll('.movingCloud').forEach(cloud => {
                const base = parseFloat(cloud.dataset.baseDuration);
                if (base) {
                    cloud.style.animationDuration = `${base * factor}s`;
                }
            });
        }

        function applyDynamicWeather(mpm) {
            const sky = document.getElementById("sky");
            if (!sky) return;

            let targetClass = "lightcloud";
            let factor = 1.0;
            let shouldRain = false;

            if (mpm < 10) {
                targetClass = "lightcloud";
                factor = 1.0;
                shouldRain = false;
            } else if (mpm >= 10 && mpm < 25) {
                targetClass = "darkcloud";
                factor = 0.5;
                shouldRain = false;
            } else if (mpm >= 25) {
                targetClass = "darkcloud";
                factor = 0.12;
                shouldRain = true;
            }

            if (sky.className !== targetClass) {
                sky.className = targetClass;
            }

            if (shouldRain) {
                makeItRain();
                playSound("rain", SoundEnum.rain, true);
            } else {
                document.querySelectorAll('.rain').forEach(el => el.innerHTML = '');
                stopSound("rain", SoundEnum.rain, true);
            }

            setCloudSpeedMultiplier(factor);
        }

        function cleanWeatherOverride() {
            weatherOverrideActive = false;
            clearTimeout(weatherOverrideTimeout);
            clearInterval(window.lightningInterval);
            document.querySelectorAll('.rain').forEach(el => el.innerHTML = '');
            stopSound("rain", SoundEnum.rain, true);
            const sky = document.getElementById("sky");
            if (sky) {
                sky.className = "lightcloud";
            }
            setCloudSpeedMultiplier(1.0);
            const rb = document.getElementById("rainbowOverlay");
            if (rb) rb.remove();
            const sn = document.getElementById("sunOverlay");
            if (sn) sn.remove();
        }

        function playThunderSound() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const audioCtx = new AudioContextClass();
                
                const bufferSize = audioCtx.sampleRate * 4.0;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                
                let lastOut = 0.0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                }
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(200, audioCtx.currentTime);
                filter.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 3.5);
                
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(1.8, audioCtx.currentTime + 0.1);
                
                const rumbleSteps = 20;
                for (let i = 1; i <= rumbleSteps; i++) {
                    const time = 0.1 + (i / rumbleSteps) * 3.5;
                    const val = (Math.random() * 0.7 + 0.3) * Math.max(0, 1 - (i / rumbleSteps));
                    gain.gain.linearRampToValueAtTime(val, audioCtx.currentTime + time);
                }
                gain.gain.linearRampToValueAtTime(0.0, audioCtx.currentTime + 4.0);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                noise.start(0);
                noise.stop(audioCtx.currentTime + 4.0);
            } catch (err) {
                console.error('Synthesized thunder error:', err);
            }
        }

        function playBubbleSound() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const audioCtx = new AudioContextClass();
                
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'sine';
                        const startFreq = 200 + Math.random() * 200;
                        const endFreq = startFreq * (2.0 + Math.random() * 1.5);
                        
                        osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.15);
                        
                        gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.15);
                    }, i * 120);
                }
            } catch (err) {
                console.error('Synthesized bubble sound error:', err);
            }
        }

        function triggerThunderstorm() {
            console.log("[Weather] Triggering Thunderstorm!");
            weatherOverrideActive = true;
            clearTimeout(weatherOverrideTimeout);
            clearInterval(window.lightningInterval);

            const sky = document.getElementById("sky");
            if (sky) {
                originalSkyClass = sky.className;
                sky.className = "darkcloud";
            }

            const strikeLightning = () => {
                const flash = document.createElement("div");
                flash.className = "thunder-flash";
                document.body.appendChild(flash);
                playThunderSound();
                setTimeout(() => flash.remove(), 1500);
            };

            strikeLightning();
            window.lightningInterval = setInterval(strikeLightning, 12000);

            makeItRain();
            playSound("rain", SoundEnum.rain, true);

            setCloudSpeedMultiplier(0.08);

            weatherOverrideTimeout = setTimeout(() => {
                cleanWeatherOverride();
                console.log("[Weather] Thunderstorm decayed. Returning to baseline.");
            }, 90000);
        }

        function triggerRainbowSunshine() {
            console.log("[Weather] Triggering Star Celebration!");
            weatherOverrideActive = true;
            clearTimeout(weatherOverrideTimeout);
            clearInterval(window.lightningInterval);

            const sky = document.getElementById("sky");
            if (sky) {
                originalSkyClass = sky.className;
                sky.className = "lightcloud";
            }

            document.querySelectorAll('.rain').forEach(el => el.innerHTML = '');
            stopSound("rain", SoundEnum.rain, true);

            setCloudSpeedMultiplier(1.8);

            playSound("celebrationSound", SoundEnum.yeah);

            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const star = document.createElement("div");
                    star.className = "celebration-star";
                    star.textContent = ["⭐", "✨", "💫", "🎉"][Math.floor(Math.random() * 4)];
                    star.style.left = `${Math.random() * 100}%`;
                    const size = Math.random() * 24 + 16;
                    star.style.fontSize = `${size}px`;
                    star.style.animationDelay = `${Math.random() * 0.5}s`;
                    document.body.appendChild(star);
                    setTimeout(() => star.remove(), 4000);
                }, i * 80);
            }

            weatherOverrideTimeout = setTimeout(() => {
                weatherOverrideActive = false;
                console.log("[Weather] Star Celebration decayed. Returning to baseline.");
                trackMessageVelocity();
            }, 10000);
        }

        function playExplosionSound() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const audioCtx = new AudioContextClass();
                
                const bufferSize = audioCtx.sampleRate * 2.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 2.0);
                
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(1.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.5);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                noise.start(0);
                noise.stop(audioCtx.currentTime + 2.5);
            } catch (err) {
                console.error('Synthesized explosion error:', err);
            }
        }

        function triggerItemEffect(item, user) {
            console.log(`[Loot] Triggering effect for ${item} used by ${user}`);

            if (item === 'potion') {
                playBubbleSound();
                for (let i = 0; i < 60; i++) {
                    setTimeout(() => {
                        const bubble = document.createElement("div");
                        bubble.className = "bubble-effect";
                        bubble.style.left = `${Math.random() * 100}%`;
                        const size = Math.random() * 25 + 10;
                        bubble.style.width = `${size}px`;
                        bubble.style.height = `${size}px`;
                        bubble.style.animationDelay = `${Math.random() * 1.5}s`;
                        document.body.appendChild(bubble);
                        setTimeout(() => bubble.remove(), 8500);
                    }, i * 120);
                }
            } 
            else if (item === 'shield') {
                playSound("shieldSound", SoundEnum.doorknock);
                for (let idx = 0; idx < 4; idx++) {
                    const topRandom = Math.floor(Math.random() * 65) + 15; // 15% to 80%
                    const leftRandom = Math.floor(Math.random() * 75) + 10; // 10% to 85%
                    setTimeout(() => {
                        const shield = document.createElement("div");
                        shield.className = "shield-overlay";
                        shield.style.top = `${topRandom}%`;
                        shield.style.left = `${leftRandom}%`;
                        document.body.appendChild(shield);
                        setTimeout(() => shield.remove(), 5000);
                    }, idx * 250);
                }
            }
            else if (item === 'umbrella') {
                playSound("umbrellaSound", SoundEnum.rainUmbrella);
                const positions = [
                    { top: '40%', left: '25%' },
                    { top: '75%', left: '75%' },
                    { top: '30%', left: '70%' },
                    { top: '70%', left: '30%' }
                ];
                positions.forEach((pos, idx) => {
                    setTimeout(() => {
                        const umbrella = document.createElement("div");
                        umbrella.className = "umbrella-overlay";
                        umbrella.style.top = pos.top;
                        umbrella.style.left = pos.left;
                        document.body.appendChild(umbrella);
                        setTimeout(() => umbrella.remove(), 6000);
                    }, idx * 300);
                });
            }
            else if (item === 'bomb') {
                playExplosionSound(); 
                document.body.classList.add("screen-shake");
                
                const smoke = document.createElement("div");
                smoke.className = "smoke-overlay";
                document.body.appendChild(smoke);
                setTimeout(() => smoke.remove(), 12000);

                setTimeout(() => {
                    document.body.classList.remove("screen-shake");
                }, 2000);
                clean();
            } 
            else if (item === 'sun-stone') {
                triggerRainbowSunshine();
            } 
            else if (item === 'rain-stone') {
                triggerThunderstorm();
            }
        }

        // FIX #15: SSE subscription to overlay events
        (function initOverlaySSE() {
            const evtSource = new EventSource('/api/stream/events');

            evtSource.onmessage = function (e) {
                try {
                    const payload = JSON.parse(e.data);
                    if (payload.event === 'note') {
                        showOverlayNote(payload.content);
                    } else if (payload.event === 'stream_started') {
                        console.log('Stream started via SSE:', payload);
                    } else if (payload.event === 'stream_stopped') {
                        console.log('Stream stopped via SSE:', payload);
                    } else if (payload.event === 'use_item') {
                        console.log('User used item via SSE:', payload);
                        triggerItemEffect(payload.item, payload.user);
                    } else if (payload.event === 'test_weather') {
                        console.log('Simulating weather event via SSE:', payload.type);
                        if (payload.type === 'thunderstorm') {
                            triggerThunderstorm();
                        } else if (payload.type === 'rainbow') {
                            triggerRainbowSunshine();
                        }
                    } else if (payload.event === 'test_mpm') {
                        console.log('Simulating chat velocity via SSE:', payload.mpm);
                        if (ceebeeSettings.dynamic_weather_enabled) {
                            applyDynamicWeather(payload.mpm);
                        }
                    }
                } catch (err) {
                    console.error('SSE parse error:', err);
                }
            };

            evtSource.onerror = function () {
                console.warn('SSE connection error, browser will reconnect automatically');
            };
        })();

        function showOverlayNote(text) {
            let noteEl = document.getElementById('overlayNoteDisplay');
            if (!noteEl) {
                noteEl = document.createElement('div');
                noteEl.id = 'overlayNoteDisplay';
                noteEl.style.cssText = [
                    'position:fixed',
                    'bottom:120px',
                    'left:50%',
                    'transform:translateX(-50%)',
                    'background:rgba(0,0,0,0.82)',
                    'color:#fff',
                    'padding:16px 28px',
                    'border-radius:12px',
                    'font-size:1.4em',
                    'z-index:9999',
                    'max-width:80vw',
                    'text-align:center',
                    'transition:opacity 0.5s',
                    'display:none'
                ].join(';');
                document.body.appendChild(noteEl);
            }
            noteEl.textContent = text;
            noteEl.style.opacity = '1';
            noteEl.style.display = 'block';
            clearTimeout(noteEl._hideTimer);
            noteEl._hideTimer = setTimeout(() => {
                noteEl.style.opacity = '0';
                setTimeout(() => { noteEl.style.display = 'none'; }, 500);
            }, 5000);
        }
    </script>
