name: Tests

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    # canvas (text2png) is optional at runtime and not needed by the tests
    - run: npm ci --ignore-scripts
    - run: npm test
